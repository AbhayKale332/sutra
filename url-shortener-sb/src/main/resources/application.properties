spring.application.name=url-shortener-sb

# Render injects PORT and scans for a listening socket on it. Falling back to
# 8080 keeps local development unchanged.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
# Dialect is auto-detected from the JDBC URL; do not set it explicitly.


jwt.secret=${JWT_SECRET}
jwt.expiration=172800000


# Framework logging stays at INFO so real errors are visible instead of buried
# in TRACE output. Raise any of these per environment when debugging, e.g.
# LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.com.url.shortener=${LOG_LEVEL_APP:INFO}

frontend.url=${FRONTEND_URL}
#Local host config
# spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortenerdb
# spring.datasource.username=postgres
# spring.datasource.password=your_password

# Redis Configuration
spring.data.redis.url=${REDIS_URL}

# Resilience: Redis must fail fast so an outage degrades the app instead of
# hanging request threads. On failure the app falls back to the database.
#
# Defaults are deliberately generous enough for a cross-region Redis (a round
# trip to another continent can exceed 200 ms, and too tight a value would turn
# a healthy Redis into constant false cache misses). If Redis is in the same
# region as the app, 150 ms on both is comfortable and makes an outage cheaper.
app.redis.command-timeout-ms=500
app.redis.connect-timeout-ms=500

# Keep short URL cache entries until memory pressure requires app-level cleanup.
# 25 MB threshold, then evict idle shortUrls::* keys until memory drops near 22 MB.
app.redis.short-url-cache.enabled=true
app.redis.short-url-cache.cleanup-interval-ms=60000
app.redis.short-url-cache.memory-threshold-bytes=26214400
app.redis.short-url-cache.target-memory-bytes=23068672
app.redis.short-url-cache.scan-count=1000

# Click buffer sync interval (how often Redis clicks are flushed to MySQL)
# Override via env var: APP_CLICK_SYNC_INTERVAL_MS=60000
app.click-sync.interval-ms=30000
